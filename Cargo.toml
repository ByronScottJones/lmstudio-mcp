[package]
name = "lmstudio-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server bridging Claude (and other MCP clients) to a local LM Studio instance — inference and model management, cross-platform (macOS, Windows, Linux)."
license = "MIT"
repository = "https://github.com/byronjones/lmstudio-mcp"
readme = "README.md"

[[bin]]
name = "lmstudio-mcp"
path = "src/main.rs"

[dependencies]
# MCP server SDK (official Rust SDK from the Model Context Protocol org)
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars", "elicitation"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process"] }

# HTTP client - rustls so there's no OpenSSL system dependency on any platform
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
url = "2"

# JSON / schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Logging to stderr (stdout is reserved for the MCP stdio protocol)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cross-platform home directory resolution (for ~/.lmstudio-mcp/feedback.json)
dirs = "6"

# Misc
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
